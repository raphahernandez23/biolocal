<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BioLocal — Identidad Digital</title>
<style>
:root {
    --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --text: #e2e8f0; --text-muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 480px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 24px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px;}
.header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
.card { background: var(--card); border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
button {
    width: 100%; padding: 16px; margin: 8px 0; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
button:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: white; }
.btn-success { background: var(--success); color: white; }
.btn-secondary { background: #334155; color: var(--text); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.status-box {
    background: #0f172a; border-radius: 12px; padding: 16px; font-family: monospace; font-size: 13px;
    white-space: pre-wrap; border-left: 4px solid var(--primary); min-height: 100px; max-height: 250px; overflow-y: auto;
}
video { width: 100%; border-radius: 12px; margin-top: 12px; background: #000; object-fit: cover; max-height: 300px;}
.hidden { display: none !important; }
.progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s ease; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛡️ BioLocal KYC</h1>
        <p>Validación Multimodal de Identidad</p>
    </div>

    <div class="card">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <button class="btn-primary" onclick="enroll()">📝 Nuevo Registro Biométrico</button>
        <button class="btn-success" onclick="verify()">✅ Verificar Identidad</button>
        <button class="btn-secondary" onclick="showAudit()">📊 Historial de Auditoría</button>
        <button class="btn-danger" onclick="resetAll()">🗑️ Borrar Base de Datos Local</button>
    </div>

    <div class="card">
        <div id="status" class="status-box">Sistema listo. Esperando instrucciones...</div>
    </div>

    <div class="card" id="camera-card" style="display:none;">
        <video id="video" autoplay playsinline muted></video>
        <div id="cam-actions"></div>
    </div>
    
    <canvas id="canvas" class="hidden"></canvas>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// ═══════════ BASE DE DATOS (IndexedDB) ═══════════
const openDB = () => new Promise((res, rej) => {
    const req = indexedDB.open('biolocal_v2', 1);
    req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('users')) db.createObjectStore('users', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('audit')) db.createObjectStore('audit', { keyPath: 'ts' });
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
});
const dbGet = async (s, k) => { const db = await openDB(); return new Promise(r => { const t = db.transaction(s).objectStore(s).get(k); t.onsuccess = () => r(t.result); }); };
const dbPut = async (s, v) => { const db = await openDB(); return new Promise(r => { const t = db.transaction(s, 'readwrite').objectStore(s).put(v); t.onsuccess = () => r(); }); };
const dbGetAll = async (s) => { const db = await openDB(); return new Promise(r => { const t = db.transaction(s).objectStore(s).getAll(); t.onsuccess = () => r(t.result); }); };
const dbClear = async (s) => { const db = await openDB(); return new Promise(r => { const t = db.transaction(s, 'readwrite').objectStore(s).clear(); t.onsuccess = () => r(); }); };

// ═══════════ UI HELPERS ═══════════
const setStatus = m => { document.getElementById('status').innerHTML = m; };
const log = m => { 
    const st = document.getElementById('status');
    st.innerHTML += '\n' + m; 
    st.scrollTop = st.scrollHeight;
};
const setProgress = pct => { document.getElementById('progress').style.width = pct + '%'; };

// ═══════════ WEBAUTHN (HUELLA DEL S26) ═══════════
const buf2b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const b64url2buf = s => {
    const b = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
    const u = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
};

async function createPasskey() {
    const cred = await navigator.credentials.create({
        publicKey: {
            challenge: crypto.getRandomValues(new Uint8Array(32)),
            rp: { name: 'BioLocal KYC', id: location.hostname },
            user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'user@local', displayName: 'Usuario KYC' },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'required' },
            timeout: 60000, attestation: 'none'
        }
    });
    return buf2b64(cred.rawId);
}

async function verifyPasskey(credIdB64) {
    const cred = await navigator.credentials.get({
        publicKey: {
            challenge: crypto.getRandomValues(new Uint8Array(32)),
            allowCredentials: [{ type: 'public-key', id: b64url2buf(credIdB64) }],
            userVerification: 'required', timeout: 60000
        }
    });
    return !!cred;
}

// Flujo interactivo de 5 dedos (Evita que el navegador bloquee los popups)
const dedos = ["Pulgar Derecho", "Índice Derecho", "Medio Derecho", "Anular Derecho", "Meñique Derecho"];
async function protocolo5Huellas(credId, esRegistro = false) {
    for (let i = 0; i < dedos.length; i++) {
        log(`\n👉 Esperando [ ${dedos[i].toUpperCase()} ]...`);
        setProgress((i / 5) * 100);
        
        // Esperar a que el usuario toque un botón para lanzar la huella (WebAuthn requiere gesto del usuario)
        await new Promise(resolve => {
            const box = document.getElementById('cam-actions'); // Reusamos el div de acciones
            box.innerHTML = `<button class="btn-primary" style="margin-top:10px" onclick="this.remove()">👆 Toca aquí para poner el ${dedos[i]}</button>`;
            box.classList.remove('hidden');
            
            // Sobrescribimos el evento click del botón para que resuelva la promesa y lance la huella
            box.querySelector('button').onclick = async (e) => {
                e.target.textContent = "⏳ Leyendo sensor...";
                try {
                    if (esRegistro && i === 0) {
                        // La primera vez crea la llave
                        const newCred = await createPasskey();
                        resolve(newCred); 
                    } else {
                        // Las demás veces verifica
                        await verifyPasskey(credId);
                        resolve(true);
                    }
                } catch (err) {
                    throw new Error("Huella cancelada o fallida.");
                }
            };
        }).then(res => { if (esRegistro && i === 0) credId = res; });
        
        log(`✅ ${dedos[i]} verificado.`);
    }
    setProgress(100);
    return credId;
}

// ═══════════ CÁMARA ═══════════
let stream = null;
const videoEl = document.getElementById('video');
const cameraCard = document.getElementById('camera-card');

async function openCamera(facing) {
    cameraCard.style.display = 'block';
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    videoEl.srcObject = null;
    await new Promise(r => setTimeout(r, 600)); // Delay para liberar hardware

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facing, width: { ideal: 1280 } }
        });
        videoEl.srcObject = stream;
        await videoEl.play();
    } catch (e) {
        log("❌ Error de cámara. Verifica los permisos en Chrome.");
        throw e;
    }
}

function closeCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    videoEl.srcObject = null;
    cameraCard.style.display = 'none';
    const box = document.getElementById('cam-actions');
    box.innerHTML = '';
    box.classList.add('hidden');
}

function captureFrame() {
    const c = document.getElementById('canvas');
    c.width = videoEl.videoWidth;
    c.height = videoEl.videoHeight;
    c.getContext('2d').drawImage(videoEl, 0, 0);
    return c.toDataURL('image/jpeg', 0.85);
}

function waitCaptureUI() {
    return new Promise(resolve => {
        const box = document.getElementById('cam-actions');
        box.innerHTML = '';
        
        const btnCam = document.createElement('button');
        btnCam.className = 'btn-primary';
        btnCam.textContent = '📸 Capturar Foto';
        btnCam.onclick = () => { box.innerHTML = ''; resolve('camera'); };
        
        const btnGal = document.createElement('button');
        btnGal.className = 'btn-secondary';
        btnGal.textContent = '🖼️ Subir de Galería';
        btnGal.onclick = () => { box.innerHTML = ''; resolve('gallery'); };
        
        box.appendChild(btnCam);
        if (document.getElementById('fileInput')) box.appendChild(btnGal);
        box.classList.remove('hidden');
    });
}

function getGalleryImage() {
    return new Promise(resolve => {
        const input = document.getElementById('fileInput');
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return resolve(null);
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(file);
        };
        input.click();
    });
}

// ═══════════ FLUJO: REGISTRO ═══════════
async function enroll() {
    setStatus('Iniciando protocolo de registro...\n');
    setProgress(0);
    try {
        log('=== PASO 1: VALIDACIÓN DE 5 HUELLAS ===');
        const credId = await protocolo5Huellas(null, true);

        log('\n=== PASO 2: DOCUMENTO DE IDENTIDAD ===');
        await openCamera('environment');
        const actionDoc = await waitCaptureUI();
        let docImg = (actionDoc === 'camera') ? captureFrame() : await getGalleryImage();
        closeCamera();
        if (!docImg) throw new Error("No se capturó documento.");
        
        log('→ Procesando OCR (aprox 5 seg)...');
        setProgress(60);
        const ocr = await Tesseract.recognize(docImg, 'spa');
        const docText = ocr.data.text;
        
        // Regex mejorado para DUI El Salvador (00000000-0) o Licencia (0614-...)
        const regexDUI = /[0-9]{8}-[0-9]{1}/g;
        const regexLicencia = /[0-9]{4}-[0-9]{6}-[0-9]{3}-[0-9]{1,2}/g;
        let docNumber = "DESCONOCIDO";
        
        const matchDUI = docText.match(regexDUI);
        const matchLic = docText.match(regexLicencia);
        
        if (matchDUI) docNumber = matchDUI[0];
        else if (matchLic) docNumber = matchLic[0];
        else {
            const fallback = docText.replace(/\s/g, '').match(/[A-Z0-9]{8,15}/);
            docNumber = fallback ? fallback[0] : "00000000";
        }

        // Extraer nombre (buscando lineas en mayúsculas)
        const lines = docText.split('\n');
        const nameLine = lines.find(l => l.length > 5 && /^[A-ZÁÉÍÓÚÑ\s\.]+$/.test(l.trim()));
        const fullName = nameLine ? nameLine.trim() : 'CIUDADANO NO IDENTIFICADO';

        log(`✅ Documento: ${docNumber}`);

        log('\n=== PASO 3: RECONOCIMIENTO FACIAL ===');
        await openCamera('user');
        await waitCaptureUI();
        const faceImg = captureFrame();
        closeCamera();
        setProgress(90);

        // Guardar en DB
        await dbPut('users', {
            id: 1, fullName, docNumber, credId, faceRef: faceImg.slice(0, 5000), enrolledAt: Date.now()
        });

        setProgress(100);
        setStatus(`🎉 REGISTRO EXITOSO\n\nNombre: ${fullName}\nDocumento: ${docNumber}\nBiometría: 5/5 Huellas`);
        
    } catch (e) {
        log('\n❌ ERROR: ' + e.message);
        setStatus('⛔ REGISTRO FALLIDO\n\n' + e.message);
        setProgress(0);
    } finally {
        closeCamera();
    }
}

// ═══════════ FLUJO: VERIFICACIÓN ═══════════
async function verify() {
    setStatus('Iniciando verificación de alta seguridad...\n');
    setProgress(0);
    try {
        const user = await dbGet('users', 1);
        if (!user) { log('❌ Base de datos vacía. Regístrate primero.'); return; }

        log('=== PASO 1: VALIDACIÓN DE 5 HUELLAS ===');
        await protocolo5Huellas(user.credId, false);

        log('\n=== PASO 2: VERIFICACIÓN DE DOCUMENTO ===');
        await openCamera('environment');
        const actionDoc = await waitCaptureUI();
        let docImg = (actionDoc === 'camera') ? captureFrame() : await getGalleryImage();
        closeCamera();
        if (!docImg) throw new Error("Documento no capturado.");

        log('→ Validando documento...');
        setProgress(60);
        const ocr = await Tesseract.recognize(docImg, 'spa');
        const cleanText = ocr.data.text.replace(/\s/g, '');
        const docOk = cleanText.includes(user.docNumber.replace(/\s/g, ''));

        if (!docOk) throw new Error("El documento NO coincide con el registrado.");
        log('✅ Documento coincide.');

        setProgress(100);
        setStatus(`🎉 ACCESO CONCEDIDO\n\nIdentidad confirmada al 100%\nUsuario: ${user.fullName}\nDoc: ${user.docNumber}\nHuellas: 5/5 Validadas.`);

        // Guardar auditoría
        await dbPut('audit', { ts: Date.now(), userId: 1, bioOk: true, docOk: true, decision: 'ACCEPT' });
        
    } catch (e) {
        log('\n❌ ACCESO DENEGADO: ' + e.message);
        setStatus('⛔ VERIFICACIÓN FALLIDA\n\n' + e.message);
        setProgress(0);
        await dbPut('audit', { ts: Date.now(), userId: 1, bioOk: false, docOk: false, decision: 'REJECT' });
    } finally {
        closeCamera();
    }
}

// ═══════════ AUDITORÍA Y RESET ═══════════
async function showAudit() {
    const logs = await dbGetAll('audit');
    if (!logs.length) { setStatus('No hay registros de auditoría.'); return; }
    logs.sort((a, b) => b.ts - a.ts);
    
    let text = "=== HISTORIAL DE AUDITORÍA ===\n\n";
    logs.forEach(l => {
        const date = new Date(l.ts).toLocaleString('es-SV');
        text += `[${date}]\nResultado: ${l.decision}\nBio: ${l.bioOk ? '✅' : '❌'} | Doc: ${l.docOk ? '✅' : '❌'}\n\n`;
    });
    setStatus(text);
}

async function resetAll() {
    if (!confirm('¿Estás seguro de borrar todos los datos biométricos locales?')) return;
    await dbClear('users');
    await dbClear('audit');
    setProgress(0);
    setStatus('✅ Base de datos borrada. Sistema reiniciado.');
}
</script>
</body>
</html>
